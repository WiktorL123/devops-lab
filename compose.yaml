services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devops_lab}
      POSTGRES_USER: ${POSTGRES_USER:-devops_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_lab_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devops_lab}:${POSTGRES_PASSWORD:-devops_lab_local}@postgres:5432/${POSTGRES_DB:-devops_lab}?schema=public
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  migrate:
    profiles:
      - tools
    build:
      context: ./backend
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devops_lab}:${POSTGRES_PASSWORD:-devops_lab_local}@postgres:5432/${POSTGRES_DB:-devops_lab}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_UPSTREAM: backend:3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

volumes:
  postgres-data:
